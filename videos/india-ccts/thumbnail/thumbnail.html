<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCTS Thumbnail</title>
<link rel="stylesheet" href="../../../assets/css/fontawesome.min.css">
<style>
@font-face { font-family: "ESC"; font-weight: 800; src: url(../../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-ExtraBold.ttf); }
@font-face { font-family: "ESC"; font-weight: 900; src: url(../../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-Black.ttf); }
@font-face { font-family: "Roboto"; font-weight: 700; src: url(../../../assets/fonts/Roboto/Roboto-Bold.ttf); }
:root { --g: #20C997; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #000; }
body { font-family: "ESC"; color: #fff; position: relative; }
canvas { position: absolute; inset: 0; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 0%, rgba(0,0,0,.92) 44%, rgba(0,0,0,.2) 75%, rgba(0,0,0,0) 100%); }
.logo { position: absolute; left: 60px; top: 46px; height: 36px; }
.k { position: absolute; left: 60px; top: 132px; font: 900 44px "ESC"; letter-spacing: .08em; color: var(--g); }
.h { position: absolute; left: 54px; top: 182px; font: 900 150px/0.86 "ESC"; letter-spacing: -0.02em; text-transform: uppercase; }
.h span { color: var(--g); }
.s { position: absolute; left: 62px; top: 548px; font: 800 44px "ESC"; }
.s b { background: var(--g); color: #00140D; padding: 4px 14px; border-radius: 8px; }
.cert { position: absolute; right: 46px; top: 96px; width: 330px; border: 5px solid var(--g); border-radius: 26px; padding: 28px 30px; background: rgba(0,20,14,.85); box-shadow: 0 0 90px rgba(32,201,151,.55); transform: rotate(5deg); }
.cert small { font: 700 18px Roboto; letter-spacing: .25em; color: var(--g); }
.cert b { display: block; font: 900 104px/1 "ESC"; margin-top: 10px; }
.cert span { font: 900 46px "ESC"; color: var(--g); }
.tag { position: absolute; right: 70px; top: 440px; font: 900 42px "ESC"; background: #fff; color: #000; padding: 10px 22px; border-radius: 12px; transform: rotate(-3deg); }
</style>
</head>
<body>
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="shade"></div>
  <img class="logo" src="../assets/regeneva-logo-white.png" alt="ReGeneva">
  <div class="k">INDIA'S CARBON MARKET</div>
  <div class="h">CCTS<br><span>Explained</span></div>
  <div class="s">How it works · Status · <b>Opportunities</b></div>
  <div class="cert"><small>CARBON CREDIT CERTIFICATE</small><b>1 CCC</b><span>= 1 tCO<sub style="font-size:.6em">2</sub>e</span></div>
  <div class="tag">2026 UPDATE</div>
<script src="../scenes/engine.js"></script>
<script src="../scenes/draw.js"></script>
<script>
  const cv = document.getElementById('c');
  const dpr = window.devicePixelRatio || 1;
  cv.width = 1280 * dpr; cv.height = 720 * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.save(); ctx.translate(380, 60); ctx.scale(0.95, 0.95);
  window.DRAW.factory(ctx, 6.0, 1280, 720, 0, { lines: [{ start: 0 }, { start: 0 }] });
  ctx.restore();
</script>
</body>
</html>
