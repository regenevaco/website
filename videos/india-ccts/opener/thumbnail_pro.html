<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCTS thumbnail (professional)</title>
<link rel="stylesheet" href="../../../assets/css/fontawesome.min.css">
<style>
@font-face { font-family: "ESC"; font-weight: 700; src: url(../../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-Bold.ttf); }
@font-face { font-family: "ESC"; font-weight: 800; src: url(../../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-ExtraBold.ttf); }
@font-face { font-family: "ESC"; font-weight: 900; src: url(../../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-Black.ttf); }
@font-face { font-family: "Roboto"; font-weight: 500; src: url(../../../assets/fonts/Roboto/Roboto-Medium.ttf); }
@font-face { font-family: "Roboto"; font-weight: 700; src: url(../../../assets/fonts/Roboto/Roboto-Bold.ttf); }
:root { --g: #20C997; --ink: #0A1311; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
body { background: radial-gradient(900px 700px at 1030px 330px, #12392F 0%, #0C1D19 45%, #070D0C 100%); font-family: "Roboto", sans-serif; color: #fff; position: relative; }
/* faint consulting-style grid + a declining emissions line */
.grid { position: absolute; inset: 0; opacity: 0.22;
  background-image: linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 48px 48px; -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 55%, transparent 80%); }
svg.trend { position: absolute; left: 0; top: 0; }
.me { position: absolute; height: 1000px; left: 690px; top: 26px;
      filter: drop-shadow(0 0 1.5px rgba(32,201,151,0.75)) drop-shadow(0 0 22px rgba(32,201,151,0.28)) drop-shadow(-24px 20px 40px rgba(0,0,0,0.55)); }
.fade { position: absolute; left: 640px; top: 0; width: 200px; height: 720px; background: linear-gradient(90deg, rgba(7,13,12,0.55), rgba(7,13,12,0)); }
.brand { position: absolute; left: 58px; top: 50px; }
.brand img { height: 50px; display: block; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.5)); }
h1 { position: absolute; left: 54px; top: 150px; width: 660px; margin: 0; font: 900 86px/0.97 "ESC"; letter-spacing: -0.005em;
     text-shadow: 0 6px 24px rgba(0,0,0,0.5); }
h1 .acc { color: var(--g); }
h1 .hl { display: inline-block; margin-top: 12px; padding: 4px 22px 10px; background: var(--g); color: #04140f; border-radius: 14px;
         text-shadow: none; box-shadow: 0 10px 30px rgba(32,201,151,0.35); }
.flow { position: absolute; left: 58px; top: 548px; display: flex; align-items: flex-start; }
.step { width: 132px; text-align: center; }
.step .c { width: 76px; height: 76px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center;
           background: var(--g); color: #04140f; font-size: 32px; box-shadow: 0 8px 24px rgba(32,201,151,0.35), inset 0 -4px 0 rgba(0,0,0,0.12); }
.step b { display: block; font: 800 25px "ESC"; letter-spacing: 0.02em; }
.arrow { width: 24px; margin-top: 26px; margin-left: 0; margin-right: 0; color: var(--g); font-size: 20px; text-align: center; }
.spot { position: absolute; left: 760px; top: -120px; width: 620px; height: 900px;
        background: radial-gradient(closest-side, rgba(32,201,151,0.38), rgba(32,201,151,0.10) 55%, rgba(32,201,151,0) 75%); }
.floor { position: absolute; left: 0; bottom: 0; width: 1280px; height: 120px; background: linear-gradient(0deg, rgba(4,8,7,0.65), rgba(4,8,7,0)); }
</style>
</head>
<body>
<div class="grid"></div>
<div class="spot"></div>
<div class="fade"></div>
<img class="me" src="SUBJECT" alt="">
<div class="floor"></div>
<div class="brand"><img src="../assets/regeneva-logo-white.png" alt="ReGeneva"></div>
<h1>India's Carbon Credit Trading Scheme <span class="acc">(CCTS)</span><br><span class="hl">Explained</span></h1>
<div class="flow">
  <div class="step"><div class="c"><i class="fa-solid fa-bullseye"></i></div><b>Targets</b></div>
  <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
  <div class="step"><div class="c"><i class="fa-solid fa-clipboard-check"></i></div><b>Verify</b></div>
  <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
  <div class="step"><div class="c"><i class="fa-solid fa-certificate"></i></div><b>Credits</b></div>
  <div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>
  <div class="step"><div class="c"><i class="fa-solid fa-arrow-right-arrow-left"></i></div><b>Trade</b></div>
</div>
</body>
</html>
