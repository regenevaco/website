<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SBTi V2.0 Thumbnail</title>
<link rel="stylesheet" href="../../assets/css/fontawesome.min.css">
<style>
@font-face { font-family: "Encode Sans Condensed"; font-weight: 800; src: url(../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-ExtraBold.ttf); }
@font-face { font-family: "Encode Sans Condensed"; font-weight: 900; src: url(../../assets/fonts/Encode_Sans_Condensed/EncodeSansCondensed-Black.ttf); }
:root { --green: #4baf47; --deep: #046d3a; --deeper: #03482a; --mint: #26ca86; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1280px; height: 720px; overflow: hidden; }
body { font-family: "Encode Sans Condensed", sans-serif; color: #fff; background: radial-gradient(circle at 15% 10%, #0b8d4d, var(--deep) 45%, var(--deeper)); position: relative; }
.grid { position: absolute; inset: 0; background-image: radial-gradient(#ffffff18 1.5px, transparent 1.5px); background-size: 34px 34px; }
.logo { position: absolute; left: 60px; top: 48px; height: 46px; }
.kick { position: absolute; left: 60px; top: 146px; font: 900 50px/1 "Encode Sans Condensed"; letter-spacing: .02em; color: var(--mint); }
.h { position: absolute; left: 60px; top: 210px; font: 900 140px/0.9 "Encode Sans Condensed"; letter-spacing: -0.01em; }
.v { position: absolute; right: 60px; top: 90px; width: 380px; height: 380px; border-radius: 60px; background: var(--mint); color: var(--deeper); display: grid; place-items: center; transform: rotate(4deg); box-shadow: 0 30px 80px #00000055; }
.v b { font: 900 210px/1 "Encode Sans Condensed"; }
.v small { position: absolute; top: 40px; font: 900 46px "Encode Sans Condensed"; letter-spacing: .2em; }
.q { position: absolute; left: 60px; bottom: 60px; display: flex; gap: 16px; }
.q span { background: #fff; color: var(--deep); font: 900 40px "Encode Sans Condensed"; padding: 12px 26px; border-radius: 16px; }
.q span:last-child { background: #ffd23f; color: #191919; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img class="logo" src="regeneva-logo-white.png" alt="ReGeneva">
  <div class="kick">SBTi NET-ZERO STANDARD</div>
  <div class="h">WHAT<br>CHANGED?</div>
  <div class="v"><small>VERSION</small><b>2.0</b></div>
  <div class="q"><span>Category A/B</span><span>Scope 1·2·3</span><span>Net zero optional?!</span></div>
</body>
</html>
